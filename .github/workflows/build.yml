name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Signing secrets are not set. Using a throwaway key, so installing a later build will require uninstalling this one (which deletes your stickers)."
          fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Stix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stix-apk
          path: Stix.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Stix.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Open this page on your phone and tap Stix.apk to install or update." \
            --latest

      - name: Write update info
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          NOTES=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          jq -n --argjson code "$RUN" --arg owner "$OWNER" --arg notes "$NOTES" '{
            versionCode: $code,
            versionName: ("1.0." + ($code | tostring)),
            apkUrl: ("https://github.com/" + $owner + "/Stix-releases/releases/download/build-" + ($code | tostring) + "/Stix.apk"),
            notes: $notes
          }' > version.json
          cat version.json

      # The app checks this public repo for updates. Needs a RELEASES_TOKEN secret
      # (fine-grained token with Contents: read & write on <owner>/Stix-releases).
      - name: Publish to the in-app update channel
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN is not set, so in-app updates won't see this build."
            exit 0
          fi
          printf '%s' "$COMMIT_MESSAGE" | head -n 1 > notes.txt
          gh release create "build-${{ github.run_number }}" Stix.apk version.json \
            --repo "$OWNER/Stix-releases" \
            --title "Stix 1.0.${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
