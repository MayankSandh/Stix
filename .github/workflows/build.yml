name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Signing secrets are not set. Using a throwaway key, so installing a later build will require uninstalling this one (which deletes your stickers)."
          fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Stix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stix-apk
          path: Stix.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Stix.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Open this page on your phone and tap Stix.apk to install or update." \
            --latest
